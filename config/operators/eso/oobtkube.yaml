# DAST Scan Automation - External Secrets Operator Configuration
# Usage: python3 scripts/automate_oobtkube_scan.py --config config/operators/eso/oobtkube.yaml

framework:
  rapidastRepo: "https://github.com/RedHatProductSecurity/rapidast.git"
  rapidastDir: "rapidast"
  configDir: "oobtkube-config"
  resultBaseDir: "results/oobtkube"
  oobtkubeScript: "scanners/generic/tools/oobtkube.py"
  oobtkubeLogLevel: debug

operator: eso
namespace: external-secrets
cr_configs:
  - plural: externalsecrets
    name: gcp-secret
  - plural: externalsecrets
    name: secret-cluster
  - plural: secretstores
    name: secretstore

application:
  shortName: "ESO-DAST"

config:
  googleCloudStorage:
    keyFile: "secrets/rapidast-sa-operators-eso_key.json"
    bucketName: "secaut-bucket"
    directory: "operators/eso"
